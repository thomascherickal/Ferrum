<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Poet — Zen Telemetry Haiku Compose Playground</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        .poet-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .bamboo-card {
            background: linear-gradient(135deg, rgba(22, 28, 22, 0.65) 0%, rgba(15, 20, 15, 0.8) 100%);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        
        /* Bamboo border glow accents */
        .bamboo-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #8b5cf6 0%, #d8b4fe 100%);
        }
        
        .haiku-box {
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 2;
            color: #f5f3ff;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-style: italic;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(216, 180, 254, 0.2);
            transition: var(--transition);
        }
        .haiku-line {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s forwards;
            margin-bottom: 0.5rem;
        }
        .haiku-line:nth-child(2) { animation-delay: 0.3s; }
        .haiku-line:nth-child(3) { animation-delay: 0.6s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .system-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
            transition: var(--transition);
        }
        .badge-cool { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge-warm { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.2); }
        .badge-hot { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        /* Interactive Telemetry range sliders */
        .sliders-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .slider-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: left;
        }
        .slider-card h3 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }
        .slider-card h3 span {
            color: #fff;
            font-weight: 700;
        }
        .slider-card input[type="range"] {
            width: 100%;
            accent-color: var(--accent-poet);
            margin-top: 1rem;
            cursor: pointer;
        }
        
        .poet-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
            transition: var(--transition);
            margin-top: 1rem;
        }
        .poet-btn:hover {
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="../index.html" class="logo">🧬 Ferrum Edge AI</a>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Suite</a>
                <a href="#" class="nav-link active">Ambient Poet</a>
            </div>
        </div>
    </header>

    <div class="poet-container">
        <h2 class="glow-text" style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--accent-poet);">Ambient Poet</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Causal Zen haiku composer reflecting live machine stress levels.</p>
        
        <!-- Haiku Box -->
        <div class="bamboo-card">
            <span id="moodBadge" class="system-badge badge-cool">System Mood: Cool</span>
            <div class="haiku-box" id="haikuContainer">
                <div class="haiku-line">Silent silicon rests,</div>
                <div class="haiku-line">Peaceful clock rates sweep,</div>
                <div class="haiku-line">Quiet is the dark.</div>
            </div>
            
            <button id="poetBtn" class="poet-btn">Compose Zen Telemetry Haiku</button>
        </div>

        <!-- Telemetry Sliders -->
        <div class="sliders-panel">
            <div class="slider-card">
                <h3>CPU Temp <span id="tempDisplay">42.5 °C</span></h3>
                <input type="range" id="tempInput" min="20.0" max="95.0" step="0.5" value="42.5">
            </div>
            <div class="slider-card">
                <h3>CPU Load (1m) <span id="loadDisplay">0.15</span></h3>
                <input type="range" id="loadInput" min="0.01" max="1.50" step="0.01" value="0.15">
            </div>
            <div class="slider-card">
                <h3>Available RAM <span id="ramDisplay">2048 MB</span></h3>
                <input type="range" id="ramInput" min="256" max="16384" step="256" value="2048">
            </div>
        </div>
    </div>

    <script type="module">
        import { loadModel, generateAutoregressive } from '../shared/engine.js';

        let currentModel = null;
        const tempInput = document.getElementById('tempInput');
        const loadInput = document.getElementById('loadInput');
        const ramInput = document.getElementById('ramInput');
        
        const tempDisplay = document.getElementById('tempDisplay');
        const loadDisplay = document.getElementById('loadDisplay');
        const ramDisplay = document.getElementById('ramDisplay');
        
        const moodBadge = document.getElementById('moodBadge');
        const haikuContainer = document.getElementById('haikuContainer');
        const poetBtn = document.getElementById('poetBtn');

        // Telemetry state helper
        function determineState(load, temp) {
            if (temp > 70.0 || load > 0.7) {
                return { label: "hot ", badge: "badge-hot", mood: "System Mood: Stress/Hot" };
            } else if (temp > 50.0 || load > 0.3) {
                return { label: "warm", badge: "badge-warm", mood: "System Mood: Active/Warm" };
            } else {
                return { label: "cool", badge: "badge-cool", mood: "System Mood: Peaceful/Cool" };
            }
        }

        // Update Slider UI
        function updateSliders() {
            const temp = parseFloat(tempInput.value);
            const load = parseFloat(loadInput.value);
            const ram = parseInt(ramInput.value);

            tempDisplay.textContent = `${temp.toFixed(1)} °C`;
            loadDisplay.textContent = load.toFixed(2);
            ramDisplay.textContent = `${ram} MB`;

            const state = determineState(load, temp);
            moodBadge.className = `system-badge ${state.badge}`;
            moodBadge.textContent = state.mood;
        }

        [tempInput, loadInput, ramInput].forEach(inp => {
            inp.addEventListener('input', updateSliders);
        });

        // Load binary model file
        async function initPlayground() {
            try {
                haikuContainer.innerHTML = "<div class='haiku-line'>Loading Zen haiku weights...</div>";
                currentModel = await loadModel('../datasets/ambient_poet/model.bin');
                haikuContainer.innerHTML = "<div class='haiku-line'>Model reloaded. Adjust parameters and write poem.</div>";
                updateSliders();
            } catch (err) {
                haikuContainer.innerHTML = "<div class='haiku-line'>Error loading model.bin file. Make sure build is complete.</div>";
            }
        }

        // Autoregressive Haiku generator
        poetBtn.addEventListener('click', async () => {
            if (!currentModel) return;

            poetBtn.disabled = true;
            poetBtn.textContent = "Writing...";
            haikuContainer.innerHTML = "";

            const temp = parseFloat(tempInput.value);
            const load = parseFloat(loadInput.value);
            const state = determineState(load, temp);
            
            let seed = `${state.label}:`;
            
            try {
                const result = await generateAutoregressive(
                    currentModel,
                    seed,
                    90,
                    0.05, // low temperature to ensure convergent, high-quality Haiku structure
                    null // fully synchronous generator inside WASM loop
                );

                // Format the haiku from string
                const plainText = result.replace(`${state.label}:`, "");
                const lines = plainText.split("\n");
                
                haikuContainer.innerHTML = "";
                lines.forEach((line, idx) => {
                    if (line.trim().length > 0 && idx < 3) {
                        const div = document.createElement('div');
                        div.className = "haiku-line";
                        div.textContent = line;
                        haikuContainer.appendChild(div);
                    }
                });
            } catch (err) {
                console.error(err);
                haikuContainer.innerHTML = "<div class='haiku-line'>Composition failed.</div>";
            } finally {
                poetBtn.disabled = false;
                poetBtn.textContent = "Compose Zen Telemetry Haiku";
            }
        });

        // Initialize
        initPlayground();
    </script>
</body>
</html>
