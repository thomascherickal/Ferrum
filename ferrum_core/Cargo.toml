[package]
name        = "ferrum_core"
description = "Zero-dependency edge Transformer & MLP engine — CPU-only, std-only, WASM-ready. Hand-build, train, and run causal Transformers and Small Language Models in pure Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
readme      = "../ReadMe.md"
repository  = "https://github.com/thomascherickal/Ferrum"
homepage    = "https://github.com/thomascherickal/Ferrum"
documentation = "https://docs.rs/ferrum_core"
keywords    = ["transformer", "edge-ai", "neural-network", "wasm", "machine-learning"]
categories  = ["science", "algorithms", "wasm", "mathematics"]

[dependencies]
# Unicode tables, both pure Rust and wasm32-safe: general categories for the GPT-2
# pre-tokenizer (\p{L}/\p{N}) and NFKC normalization for `prepare`.
unicode-general-category = "1.1"
unicode-normalization = "0.1"

# Std-only matmul benchmark (no Criterion): `harness = false` runs its own
# `fn main()` with `std::time::Instant`, keeping the zero-dependency guarantee.
[[bench]]
name    = "gemm"
harness = false
