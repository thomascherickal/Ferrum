[workspace]
members  = ["ferrum_core", "tabular_wasm", "train_cli", "tests"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

[profile.release-wasm]
inherits  = "release"
opt-level = "z"
strip     = true
