[workspace]
members  = ["ferrum_core", "tabular_wasm", "train_cli", "slm_cli", "tests"]
# The Tauri desktop/mobile GUI is its own crate. It is deliberately excluded
# from this workspace because it pulls in heavy GUI system dependencies
# (webkit2gtk / wry) that the headless core build must not require. Build it
# from inside `ferrum_gui/` with `cargo tauri dev`.
exclude  = ["ferrum_gui"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

[profile.release-wasm]
inherits  = "release"
opt-level = "z"
strip     = true
