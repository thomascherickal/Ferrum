name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace

  lint:
    name: Lint (clippy, rustfmt, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt (workspace)
        run: cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: JavaScript syntax check
        run: |
          node --check ferrum_gui/ui/app.js
          node --check ferrum_gui/ui/stream.js
          node --check ferrum_gui/ui/stream.test.js
          # engine.js is an ES module; node ignores --input-type for file args,
          # so check it via stdin in module mode.
          node --input-type=module --check < web/shared/engine.js

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (workspace)
        run: cargo deny check
      - name: cargo-deny (ferrum_gui)
        run: cargo deny --manifest-path ferrum_gui/Cargo.toml check --config deny.toml

  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # X2: the WASM target uses the KV cache and is excluded from the workspace
      # build, so verify it compiles for wasm32 on every change.
      - name: Build WASM bindings
        run: cargo build -p tabular_wasm --target wasm32-unknown-unknown --release
      - name: Clippy (wasm32)
        run: cargo clippy -p tabular_wasm --target wasm32-unknown-unknown -- -D warnings

  gui:
    name: Build & test (ferrum_gui, Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # X1: ferrum_gui is its own crate (heavy webkit deps) and is excluded from
      # the workspace, so it needs a dedicated job to stay covered by CI.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ferrum_gui/target
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt (ferrum_gui)
        working-directory: ferrum_gui
        run: cargo fmt -- --check
      - name: Clippy (ferrum_gui)
        working-directory: ferrum_gui
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check (all targets)
        working-directory: ferrum_gui
        run: cargo check --all-targets
      - name: Run backend command tests
        working-directory: ferrum_gui
        run: cargo test
      - name: Run UI stream-reconciliation tests
        run: node ferrum_gui/ui/stream.test.js
